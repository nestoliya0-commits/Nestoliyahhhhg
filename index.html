<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YFYT Booking Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap');

  :root {
    --earth: #2C1810;
    --cream: #FAF6EE;
    --sage: #7A9B6E;
    --wheat: #C8A96A;
    --terracotta: #B85C38;
    --light-sage: #EFF4EC;
    --border: #E2D9C8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .widget-wrap {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 680px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(44,24,16,0.18);
    border: 1px solid var(--border);
    background: #fff;
  }

  /* Header */
  .header {
    background: var(--earth);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .header-icon {
    width: 42px; height: 42px;
    background: var(--wheat);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header-text h2 {
    font-family: 'Playfair Display', serif;
    color: var(--cream);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.2;
  }
  .header-text p {
    color: var(--wheat);
    font-size: 12px;
    margin-top: 2px;
    font-weight: 300;
  }
  .status-dot {
    width: 8px; height: 8px;
    background: #7ED87E;
    border-radius: 50%;
    margin-left: auto;
    box-shadow: 0 0 0 2px rgba(126,216,126,0.3);
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--cream);
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Messages */
  .msg { display: flex; gap: 10px; max-width: 90%; }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px;
    background: var(--earth);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--earth);
  }
  .msg.bot .bubble {
    background: #fff;
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--earth);
    color: var(--cream);
    border-bottom-right-radius: 4px;
  }

  /* Quick reply chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 18px 12px 18px;
    background: var(--cream);
  }
  .chip {
    background: #fff;
    border: 1.5px solid var(--wheat);
    color: var(--earth);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.18s;
    font-weight: 500;
  }
  .chip:hover {
    background: var(--wheat);
    color: #fff;
    border-color: var(--wheat);
  }

  /* Typing indicator */
  .typing { display: flex; gap: 5px; padding: 8px 12px; align-items: center; }
  .typing span {
    width: 7px; height: 7px;
    background: var(--wheat);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-7px); opacity: 1; }
  }
  .typing-bubble {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: inline-block;
  }

  /* Input area */
  .input-area {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    background: #fff;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-area input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--earth);
    outline: none;
    transition: border-color 0.2s;
    background: var(--cream);
  }
  .input-area input:focus { border-color: var(--sage); }
  .input-area input::placeholder { color: #B0A898; }
  .send-btn {
    width: 42px; height: 42px;
    background: var(--earth);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: var(--terracotta); }
  .send-btn svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; }

  /* Booking summary card */
  .booking-card {
    background: var(--light-sage);
    border: 1.5px solid var(--sage);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 4px;
    font-size: 13px;
  }
  .booking-card h4 {
    font-family: 'Playfair Display', serif;
    color: var(--earth);
    font-size: 15px;
    margin-bottom: 10px;
  }
  .booking-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    color: var(--earth);
  }
  .booking-row:last-child { border-bottom: none; }
  .booking-row span:first-child { color: #6B5744; font-weight: 500; }
  .confirm-btn {
    margin-top: 12px;
    width: 100%;
    background: var(--terracotta);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .confirm-btn:hover { background: #9e4a2c; }
</style>
</head>
<body>

<div class="widget-wrap">
  <div class="header">
    <div class="header-icon">🌿</div>
    <div class="header-text">
      <h2>YFYT Booking Assistant</h2>
      <p>Restaurant Constance · Charlotte, NC</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="chips" id="chipsArea"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type your message..." />
    <button class="send-btn" onclick="handleSend()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are a warm, knowledgeable booking assistant for Your Farms Your Table Group (YFYT) — a beloved farm-to-table dining group in Charlotte, NC. Your main role is Restaurant Constance reservations, but you also handle catering inquiries, personal chef experiences, and private events.

RESTAURANT INFO:
- Restaurant Constance — flagship farm-to-table restaurant, Charlotte NC
- Address: 2200 Thrift Road, Charlotte, NC 28208
- Phone: 980-549-1999
- Email: foodteam@yfytgroup.com
- Reservation link: https://tables.toasttab.com/restaurants/ee050f6c-7e01-42f7-9836-460ede1edb20/reserve
- Private events / catering: jill@yfytgroup.com

SERVICES:
1. Restaurant Constance – dine-in reservations (walk them through date, party size, time, special requests)
2. Catering & Events – bespoke farm-to-table catering (direct to jill@yfytgroup.com)
3. Personal Chef Experience – at-home custom meals (booking link: https://www.toasttab.com/invoice/lead?rx=ee050f6c-7e01-42f7-9836-460ede1edb20&ot=ded4cec1-1e26-4db8-8162-f3de5f86cb14)
4. Private Events – venue hire at Restaurant Constance (direct to jill@yfytgroup.com)
5. Community Supported Meals – community program info

BOOKING FLOW for Restaurant Constance:
Step 1: Ask preferred date
Step 2: Ask party size
Step 3: Ask preferred time (lunch or dinner)
Step 4: Ask for name and any special requests (dietary, occasion, allergies)
Step 5: Provide reservation summary with the booking link

TONE: Warm, welcoming, farm-to-table earthy elegance. Think Chef Sam Diminich's spirit — genuine, community-focused, heartfelt. Keep responses concise (2-4 sentences max). Use light emojis occasionally 🌿🌾

IMPORTANT: When you have all booking details, output a JSON block at the end of your message ONLY in this exact format (no markdown fences):
BOOKING_DATA:{"name":"...","date":"...","time":"...","party":...,"special":"..."}

For other inquiries (catering, chef, private events), give the right contact/link and offer to help further.`;

let conversationHistory = [];
let bookingData = null;

async function callClaude(userMessage) {
  conversationHistory.push({ role: "user", content: userMessage });

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: conversationHistory
    })
  });

  const data = await response.json();
  const rawText = data.content?.[0]?.text || "I'm sorry, I couldn't process that. Please try again.";

  // Extract booking data if present
  let displayText = rawText;
  if (rawText.includes("BOOKING_DATA:")) {
    const parts = rawText.split("BOOKING_DATA:");
    displayText = parts[0].trim();
    try {
      bookingData = JSON.parse(parts[1].trim());
    } catch(e) {}
  }

  conversationHistory.push({ role: "assistant", content: rawText });
  return displayText;
}

function addMessage(text, sender, isHTML = false) {
  const chatArea = document.getElementById("chatArea");
  const msgDiv = document.createElement("div");
  msgDiv.className = `msg ${sender}`;

  if (sender === "bot") {
    msgDiv.innerHTML = `
      <div class="avatar">🌿</div>
      <div class="bubble">${isHTML ? text : escapeHTML(text).replace(/\n/g, '<br>')}</div>
    `;
  } else {
    msgDiv.innerHTML = `<div class="bubble">${escapeHTML(text)}</div>`;
  }

  chatArea.appendChild(msgDiv);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping() {
  const chatArea = document.getElementById("chatArea");
  const div = document.createElement("div");
  div.className = "msg bot";
  div.id = "typingIndicator";
  div.innerHTML = `
    <div class="avatar">🌿</div>
    <div class="typing-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

function showBookingCard(data) {
  const chatArea = document.getElementById("chatArea");
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = `
    <div class="avatar">🌿</div>
    <div class="booking-card">
      <h4>🌾 Reservation Summary</h4>
      <div class="booking-row"><span>Guest</span><span>${escapeHTML(data.name)}</span></div>
      <div class="booking-row"><span>Date</span><span>${escapeHTML(data.date)}</span></div>
      <div class="booking-row"><span>Time</span><span>${escapeHTML(data.time)}</span></div>
      <div class="booking-row"><span>Party Size</span><span>${data.party} guests</span></div>
      ${data.special ? `<div class="booking-row"><span>Notes</span><span>${escapeHTML(data.special)}</span></div>` : ''}
      <button class="confirm-btn" onclick="window.open('https://tables.toasttab.com/restaurants/ee050f6c-7e01-42f7-9836-460ede1edb20/reserve','_blank')">
        Complete Reservation →
      </button>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function setChips(options) {
  const chipsArea = document.getElementById("chipsArea");
  chipsArea.innerHTML = "";
  options.forEach(opt => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = opt;
    chip.onclick = () => {
      chipsArea.innerHTML = "";
      processUserMessage(opt);
    };
    chipsArea.appendChild(chip);
  });
}

async function processUserMessage(text) {
  addMessage(text, "user");
  showTyping();

  try {
    const reply = await callClaude(text);
    hideTyping();
    addMessage(reply, "bot");

    if (bookingData) {
      showBookingCard(bookingData);
      bookingData = null;
      setChips(["Book another table", "Catering inquiry", "Private event"]);
    } else {
      // Contextual chips
      const lower = text.toLowerCase() + reply.toLowerCase();
      if (lower.includes("cater") || lower.includes("event") || lower.includes("wedding")) {
        setChips(["Tell me more", "Get a quote", "Contact Jill"]);
      } else if (lower.includes("chef") || lower.includes("home")) {
        setChips(["Book personal chef", "Learn more", "Other services"]);
      } else if (lower.includes("date") || lower.includes("when") || lower.includes("reserv")) {
        setChips(["Tonight", "This weekend", "Next week"]);
      } else if (lower.includes("party") || lower.includes("how many") || lower.includes("guests")) {
        setChips(["Just me (1)", "2 guests", "4 guests", "Large group (6+)"]);
      } else {
        setChips([]);
      }
    }
  } catch(e) {
    hideTyping();
    addMessage("I'm having a little trouble right now. Please call us at 980-549-1999 or email foodteam@yfytgroup.com 🌿", "bot");
  }
}

async function handleSend() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  document.getElementById("chipsArea").innerHTML = "";
  await processUserMessage(text);
}

document.getElementById("userInput").addEventListener("keydown", e => {
  if (e.key === "Enter") handleSend();
});

// Initial greeting
async function init() {
  showTyping();
  await new Promise(r => setTimeout(r, 1000));
  hideTyping();
  addMessage("Welcome to Your Farms Your Table! 🌿\n\nI'm here to help you reserve a table at Restaurant Constance, book a personal chef experience, or arrange catering for your next event.\n\nWhat can I help you with today?", "bot");
  setChips(["Reserve a table", "Catering & events", "Personal chef experience", "Private event"]);
}

init();
</script>
</body>
</html>
